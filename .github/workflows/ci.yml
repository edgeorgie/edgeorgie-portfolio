name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      # Build must run before `typecheck`: Next generates route types
      # (e.g. `LayoutProps`) into `.next/types`, which tsconfig.json
      # includes. Running `tsc --noEmit` on a clean checkout fails with
      # "Cannot find name 'LayoutProps'" until those types exist.
      #
      # No secrets are provided to this step on purpose — the build must
      # not depend on any environment config that only exists locally or
      # on Vercel.
      - name: Build
        run: npm run build

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      # `--omit=dev` is the deliberate scope, not laziness. This repo's 5 high
      # advisories sit entirely in the dev tree (eslint-config-next ->
      # @next/eslint-plugin-next -> fast-glob -> micromatch -> braces), whose
      # only fix is a MAJOR downgrade of eslint-config-next to v14 — a real
      # regression to silence a vulnerability that never ships. What reaches a
      # visitor is the production dependency tree, and that is what this gates:
      # `npm audit --omit=dev --audit-level=high` is currently 0 findings, so
      # the gate starts green and fails the day a shipped dependency regresses.
      #
      # Runs as a separate step after the suite so a new advisory is reported as
      # "advisory", not mixed in with a test failure.
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
