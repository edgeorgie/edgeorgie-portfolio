name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      # Build must run before `typecheck`: Next generates route types
      # (e.g. `LayoutProps`) into `.next/types`, which tsconfig.json
      # includes. Running `tsc --noEmit` on a clean checkout fails with
      # "Cannot find name 'LayoutProps'" until those types exist.
      #
      # No secrets are provided to this step on purpose — the build must
      # not depend on any environment config that only exists locally or
      # on Vercel.
      - name: Build
        run: npm run build

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test
