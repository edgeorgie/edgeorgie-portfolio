name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      # Build must run before `typecheck`: Next generates route types
      # (e.g. `LayoutProps`) into `.next/types`, which tsconfig.json
      # includes. No secrets are provided on purpose — the build must not
      # depend on any environment config that only exists locally or on Vercel.
      - name: Build
        run: npm run build

      # Analytics must be absent from the client bundle when no key is set
      # (docs/POSTHOG_PLAN.md §5): not just unused, not shipped.
      - name: Analytics is absent from the bundle without a key
        run: |
          if grep -rli posthog .next/static; then
            echo "posthog code reached the client bundle without NEXT_PUBLIC_POSTHOG_KEY" >&2
            exit 1
          fi

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      # SCOPE: `--omit=dev`. Dev dependencies can still affect what ships
      # (tailwindcss/typescript OUTPUT is the artifact). `npm ci` pins every
      # install to the lockfile and `.github/dependabot.yml` keeps those pins
      # under weekly review, but both only react to published advisories
      # against known versions — a build-time package that is malicious before
      # any advisory exists still gets through. That gap is narrowed here, not
      # closed. The only advisories present resolve to the `eslint-config-next`
      # lint subtree (fast-glob -> micromatch -> braces), which runs the linter
      # and emits nothing; the only npm fix is a major downgrade of
      # eslint-config-next. The production tree is 0 findings.
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: End-to-end tests (production build)
        run: npm run e2e
        env:
          CI: "true"

      - name: Upload Playwright traces on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: test-results/
          retention-days: 7

      # The OTHER half of the no-key assertion above, and the half that
      # actually runs in production. "The SDK is absent without a key" is, on
      # its own, equally satisfied by analytics being permanently dead: a typo
      # in `loadAnalytics()`'s env read, or a bundler change that prunes the
      # dynamic import unconditionally, leaves CI fully green and ships a site
      # that silently records nothing. This proves a key-set build really does
      # emit the SDK, so the bundler-visibility contract in
      # src/lib/analytics.ts (a literal `process.env` read, deliberately not a
      # module constant, so the import can be proven unreachable) is verified
      # in BOTH directions.
      #
      # The marker is `__PosthogExtensions__`, not the string "posthog".
      # Grepping for the vendor's name is unsound HERE in a way it is not in
      # the no-key check above: src/lib/analytics.ts inlines
      # `ui_host: "https://us.posthog.com"` into the app's own chunk, so a
      # `grep -li posthog` finds a match on a build where posthog-js was
      # pruned entirely and the step passes while analytics is dead — the
      # exact failure it exists to catch. Measured: on a pruned mutant,
      # `grep -rli posthog` → 1 file, `__PosthogExtensions__` → 0.
      # `__PosthogExtensions__` is an SDK-internal global that appears only in
      # posthog-js's own code and nowhere in this repo (asserted below, so the
      # day the marker is renamed upstream this fails loudly instead of
      # silently reverting to a vacuous check).
      #
      # Deliberately the LAST step: it overwrites `.next` with a key-set build,
      # and both the no-key bundle assertion and the e2e suite read `.next`.
      # The key is a syntactically valid, non-existent project token — the
      # build is static, nothing executes, and this step only greps chunks.
      - name: Analytics IS present in the bundle with a key
        env:
          NEXT_PUBLIC_POSTHOG_KEY: phc_ci_bundle_probe_not_a_real_project
        run: |
          # Guard the guard: the marker must come from the SDK, not from us.
          if grep -rl __PosthogExtensions__ src/ 2>/dev/null; then
            echo "__PosthogExtensions__ appears in this repo's own source, so it" >&2
            echo "no longer distinguishes 'the SDK shipped' from 'our code shipped'" >&2
            exit 1
          fi
          npm run build
          count=$(grep -rl __PosthogExtensions__ .next/static | wc -l)
          echo "client chunks containing the posthog-js SDK marker: $count"
          if [ "$count" -eq 0 ]; then
            echo "NEXT_PUBLIC_POSTHOG_KEY was set but posthog-js did not reach the" >&2
            echo "client bundle — analytics would be silently dead in production" >&2
            exit 1
          fi


