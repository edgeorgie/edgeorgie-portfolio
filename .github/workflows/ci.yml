name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      # Build must run before `typecheck`: Next generates route types
      # (e.g. `LayoutProps`) into `.next/types`, which tsconfig.json
      # includes. Running `tsc --noEmit` on a clean checkout fails with
      # "Cannot find name 'LayoutProps'" until those types exist.
      #
      # No secrets are provided to this step on purpose — the build must
      # not depend on any environment config that only exists locally or
      # on Vercel.
      - name: Build
        run: npm run build

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      # SCOPE: `--omit=dev`, and this is NOT the claim that dev dependencies
      # cannot affect what ships. They can — `tailwindcss` and `typescript` are
      # devDependencies whose OUTPUT is the shipped artifact, so a compromised
      # version of either injects straight into the CSS/JS a visitor downloads.
      # That class of build-time supply-chain attack is exactly what this flag
      # is blind to, and it is covered by other things: `npm ci` against a
      # committed lockfile, and Dependabot alerts on the repo.
      #
      # The narrower claim this flag rests on is about the advisories actually
      # present: they resolve to the `eslint-config-next` lint subtree
      # (@next/eslint-plugin-next -> fast-glob -> micromatch -> braces), which
      # runs the linter and emits nothing, and the only fix npm offers is a
      # MAJOR downgrade of `eslint-config-next` to v14 — a real regression to
      # silence a finding in code that never executes at build or runtime.
      #
      # The production tree is 0 findings today, so this gate starts green and
      # fails when something reachable regresses. Separate step from the suite so
      # an advisory reads as an advisory, not as a test failure.
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
